[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "PlayerokHelper"
version = "0.5.0"
description = "Single-store Playerok automation with KOSell and encrypted stock"
requires-python = ">=3.11"
license-files = ["THIRD_PARTY_NOTICES.md"]
dependencies = [
  "aiogram>=3.15,<4", "httpx[http2]>=0.28,<1", "cryptography>=44,<48",
  "openpyxl>=3.1,<4", "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1"]

[project.scripts]
playerok-bot = "shopbot.cli:main"
playerokhelper = "shopbot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shopbot = ["contracts/*.graphql", "schema.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

